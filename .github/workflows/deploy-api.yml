name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish API
        run: |
          dotnet publish backend/AmusedToDeath.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./publish

      - name: Deploy to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          source: "publish/*"
          target: "/opt/a2d-api-staging"
          strip_components: 1
          overwrite: true
          rm: true
          timeout: 120s
          command_timeout: 10m

      - name: Stop, swap, and start service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Stop the running service (ignore failure if not yet installed)
            sudo systemctl stop a2d-api || true

            # Swap staging into live, keeping the previous build as a rollback
            rm -rf /opt/a2d-api-old
            if [ -d /opt/a2d-api ]; then
              mv /opt/a2d-api /opt/a2d-api-old
            fi
            mv /opt/a2d-api-staging /opt/a2d-api

            # Ensure the self-contained binary is executable
            chmod +x /opt/a2d-api/AmusedToDeath.Api

            # Start the service
            sudo systemctl start a2d-api

name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Everything below only runs on pushes to master, not on PRs.
      - name: Upload build to staging directory
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: "/var/www/www.amusedtodeath.eu-staging"
          strip_components: 2
          overwrite: true
          rm: true
          timeout: 120s
          command_timeout: 10m

      - name: Swap staging into web root
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Swap the freshly uploaded build into the live web root, keeping the
            # previous build for rollback. Atomic enough that nginx never serves
            # a half-uploaded SPA.
            rm -rf /var/www/www.amusedtodeath.eu-old
            if [ -d /var/www/www.amusedtodeath.eu ]; then
              mv /var/www/www.amusedtodeath.eu /var/www/www.amusedtodeath.eu-old
            fi
            mv /var/www/www.amusedtodeath.eu-staging /var/www/www.amusedtodeath.eu
